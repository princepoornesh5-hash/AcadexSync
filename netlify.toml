[[plugins]]
  package = "netlify-plugin-flutter"

  [plugins.inputs]
  channel = "stable"

[build]
  base = "Frontend"
  publish = "build/web"
  command = "flutter build web --release --dart-define=API_BASE_URL=https://acadex-backend-main.onrender.com/api/v1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
